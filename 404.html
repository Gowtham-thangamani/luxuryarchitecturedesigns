    <style>
        :root {
            --gold: #C9A962;
            --black: #0A0A0A;
            --charcoal: #1A1A1A;
            --off-white: #F5F3EF;
            --light-gray: #8A8A8A;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: var(--black);
            color: var(--off-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        
        .error-container {
            max-width: 600px;
        }
        
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 500;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 500;
            margin-bottom: 1.5rem;
        }
        
        p {
            color: var(--light-gray);
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--gold);
            color: var(--black);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 169, 98, 0.3);
        }
        
        .links {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .links a {
            color: var(--light-gray);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }
        
        .links a:hover {
            color: var(--gold);
        }
        
        .logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }
        
        .logo svg {
            width: 40px;
            height: 40px;
        }
        
        .logo-text {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1rem;
        }
