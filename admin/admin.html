<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5YK18VDL3H"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-5YK18VDL3H');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel | Luxury Architecture Designs</title>
    
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    
    <style>
        body {
            background: var(--black);
        }
        
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .admin-login-container {
            width: 100%;
            max-width: 450px;
        }
        
        .admin-login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .admin-login-logo .logo {
            display: inline-flex;
            justify-content: center;
        }
        
        .admin-login-card {
            background: var(--charcoal);
            border: 1px solid var(--dark-gray);
            padding: 3rem;
        }
        
        .admin-login-card h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--off-white);
        }
        
        .admin-login-card p {
            text-align: center;
            color: var(--light-gray);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        
        .admin-login-card .form-group {
            margin-bottom: 1.5rem;
        }
        
        .admin-login-card label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--light-gray);
            margin-bottom: 0.5rem;
        }
        
        .admin-login-card input {
            width: 100%;
            padding: 1rem;
            background: var(--dark-gray);
            border: 1px solid var(--medium-gray);
            color: var(--off-white);
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        
        .admin-login-card input:focus {
            outline: none;
            border-color: var(--gold);
        }
        
        .admin-login-error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.8rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            display: none;
        }
        
        .admin-login-error.show {
            display: block;
        }
        
        .admin-login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--gold);
            color: var(--black);
            border: none;
            font-family: var(--font-body);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .admin-login-btn:hover {
            background: var(--gold-light);
        }
        
        .admin-login-footer {
            text-align: center;
            margin-top: 2rem;
        }
        
        .admin-login-footer a {
            color: var(--light-gray);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .admin-login-footer a:hover {
            color: var(--gold);
        }
        
        .admin-credentials {
            background: var(--dark-gray);
            padding: 1rem;
            margin-top: 1.5rem;
            border-left: 3px solid var(--gold);
        }
        
        .admin-credentials p {
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            text-align: left;
        }
        
        .admin-credentials code {
            background: var(--charcoal);
            padding: 0.2rem 0.5rem;
            color: var(--gold);
        }
    </style>
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-container">
            <div class="admin-login-logo">
                <a href="../index.html" class="logo" target="_blank" rel="noopener noreferrer">
                    <div class="logo-icon">
                        <img src="../assets/images/logo.png" alt="Luxury Architecture Designs Logo">
                    </div>
                    <div class="logo-text">
                        <span class="main">Luxury Architecture Designs</span>
                                            </div>
                </a>
            </div>
            
            <div class="admin-login-card">
                <h1>Admin Panel</h1>
                <p>Sign in to manage your website content</p>
                
                <div class="admin-login-error" id="loginError">Invalid username or password. Please try again.</div>
                
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="admin-login-btn">Sign In</button>
                </form>
                
               
            </div>
            
            <div class="admin-login-footer">
                <a href="../index.html" target="_blank" rel="noopener noreferrer">← Back to Website</a>
            </div>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script>
        // Simple hash function for password
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                hash = ((hash << 5) - hash) + password.charCodeAt(i);
                hash = hash & hash;
            }
            return hash.toString();
        }
        
        // Admin credentials
        const ADMIN = {
            username: 'admin',
            passHash: '92668751' // hash of 'admin'
        };
        
        // Handle form submission
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('loginError');
            
            if (username === ADMIN.username && hashPassword(password) === ADMIN.passHash) {
                // Set session
                localStorage.setItem('lad_session', JSON.stringify({
                    loggedIn: true,
                    expiry: Date.now() + 86400000 // 24 hours
                }));
                
                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } else {
                errorEl.classList.add('show');
                setTimeout(() => errorEl.classList.remove('show'), 3000);
            }
        });
        
        // Check if already logged in
        const session = localStorage.getItem('lad_session');
        if (session) {
            const data = JSON.parse(session);
            if (data.loggedIn && data.expiry > Date.now()) {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
